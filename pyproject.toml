[project]
name = "deckard"
version = "0.1.0"
description = "FastAPI backend for website scraping and LLM extraction"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.30.0",
    "crawl4ai>=0.8.6",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "tiktoken>=0.13.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
